    persona: commercial_admin
    question: "/trace FS-AUTO-305"
    expected_status: ok
    expected_tool: trace_contract
    must_contain: ["Disconnected from Financial Ledger", "unmatched_efl_record", "$185,000"]
  - id: Q09
    persona: bu_director
    question: "/trace TM-ENV-401"
    expected_status: ok
    expected_tool: trace_contract
    must_contain: ["64.0%", "128", "200"]
  - id: Q10
    persona: commercial_admin
    question: "/trace SP-REV-901"
    expected_status: ok
    expected_tool: trace_contract
    must_contain: ["N/A (Commercial Revenue Adjustment Contract)", "$45,000"]
  - id: Q11
    persona: commercial_admin
    question: "/trace SP-COST-902"
    expected_status: ok
    expected_tool: trace_contract
    must_contain: ["N/A (Internal Operational Holding Pool)", "$28,500"]
