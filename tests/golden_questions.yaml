    persona: bu_director
    question: "How is the $120,000 shared laboratory overhead allocated across Business Units?"
    expected_status: ok
    expected_tool: get_shared_overhead_allocation
    must_contain: ["$120,000", "Cat-8000", "Cat-9000", "BU-AERO-02"]
  - id: Q13
    persona: bu_director
    question: "Which T&M contracts are below 80% utilization or have unapproved timesheets?"
    expected_status: ok
    expected_tool: get_labor_and_timesheet_compliance
    must_contain: ["TM-ENV-401", "64.0%", "TM-ELEC-204", "36"]
  - id: Q14
    persona: commercial_admin
    question: "Run a master data integrity audit for unmatched EFL records and orphaned fees"
    expected_status: ok
    expected_tool: get_data_integrity_audit
    must_contain: ["unmatched_efl_record", "task_missing_rate_link", "orphaned_fee_structure"]
  - id: Q15
    persona: bu_director
    question: "/log EXC-101 Confirm overtime freeze and client scope renegotiation"
    expected_status: ok
    expected_tool: log_remediation_action
    must_contain: ["Fact_ActionLog", "EXC-101", "FS-AERO-104"]
