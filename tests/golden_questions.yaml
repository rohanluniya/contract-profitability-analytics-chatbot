# 18-Question Golden Evaluation Suite for Apex Margin Advisor
questions:
  - id: Q01
    persona: bu_director
    question: "/summary"
    expected_status: ok
    expected_tool: get_portfolio_summary
    must_contain: ["Executive Portfolio Summary", "$120,000", "Indirect Lab Burden", "FS-AERO-104"]
  - id: Q02
    persona: pm_delivery
    question: "/summary"
    expected_status: ok
    expected_tool: get_portfolio_summary
    must_contain: ["PM Delivery Summary", "6 assigned contracts", "FS-AERO-104"]
  - id: Q03
    persona: commercial_admin
    question: "/summary"
    expected_status: ok
    expected_tool: get_portfolio_summary
    must_contain: ["Commercial & Ledger Reconciliation Summary", "FS-AUTO-305", "DISC-SPECIALIST-9"]
  - id: Q04
    persona: bu_director
