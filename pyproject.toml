[project]
name = "apex-margin-advisor"
version = "1.0.0"
description = "Apex Margin Advisor: TIC Portfolio Margin & Exception Intelligence Assistant. Synthetic demo data."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sqlalchemy>=2.0.30",
    "duckdb>=1.1",
    "duckdb-engine>=0.13",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16,<20",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "litellm>=1.50",
    "streamlit>=1.39",
    "plotly>=5.24",
    "rapidfuzz>=3.10",
    "openpyxl>=3.1",
    "tabulate>=0.9",
]

[dependency-groups]
dev = [
    "av>=18.1.0",
    "playwright>=1.65.2",
    "pytest>=8.3",
    "python-pptx>=1.0.2",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
